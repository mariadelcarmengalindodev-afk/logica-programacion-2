<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Temperatura</title>
</head>
<body>
    <div class="container">
    <h2>Conversor de Temperatura</h2>
    
    <form id="temp-form">
      
      <!--Ingreso de temperatura -->
      <div class="form-group">
        <label for="temp">Temperatura en Celsius</label>
        <input type="number" id="temp" name="temp" placeholder="Tu temperatura" required>
      </div>

      <!-- Conversion a Fahrenheit -->
      <div class="form-group">
      <p><strong>Fahrenheit:</strong> <span id="fahrenheit"></span></p>
    </div>

      <!-- Conversion a Kelvin-->
      <div class="form-group">
        <div class="form-group">
      <p><strong>Kelvin:</strong> <span id="kelvin"></span></p>
    </div>
      </div>

      <button type="submit" id="btn-convetir">Convertir</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
